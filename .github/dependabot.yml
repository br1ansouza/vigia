version: 2
updates:
  - package-ecosystem: mix
    directory: /
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 9 */2 * *"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      phoenix:
        patterns:
          - "phoenix*"
          - "bandit"
          - "lazy_html"
        update-types: [minor, patch]
      demais:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 9 */2 * *"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
